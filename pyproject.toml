[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hh_model"
version = "0.1.0"
description = "Hodgkin-Huxley neuron modeling: from single spikes to network synchronization"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pytest>=7.4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.4"

testpaths = [
    "tests"
]